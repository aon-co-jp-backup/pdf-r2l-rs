name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build
        run: |
          cargo test --release -p pdf-r2l-core
          cargo build --release -p pdf-r2l-desktop -p pdf-r2l-cli
      - name: Installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\pdf-r2l-rs.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/pdf-r2l-rs-setup.exe
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test and build (universal)
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo test --release -p pdf-r2l-core
          cargo build --release -p pdf-r2l-desktop --target aarch64-apple-darwin
          cargo build --release -p pdf-r2l-desktop --target x86_64-apple-darwin
      - name: Package dmg
        run: sh packaging/make-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - name: Test and build
        run: |
          cargo test --release -p pdf-r2l-core
          cargo build --release -p pdf-r2l-desktop -p pdf-r2l-cli
          cargo install cargo-deb --locked
          cargo deb -p pdf-r2l-desktop --no-build
      - name: Package
        run: |
          mkdir -p dist/pdf-r2l-rs
          cp target/release/pdf-r2l-rs target/release/pdf-r2l-cli LICENSES.txt dist/pdf-r2l-rs/
          tar -C dist -czf dist/pdf-r2l-rs-x86_64.tar.gz pdf-r2l-rs
          cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.tar.gz
  android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust toolchain and cargo-ndk
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo install cargo-ndk --locked
      - name: Rust tests
        run: cargo test --release -p pdf-r2l-android
      - name: Build signed APK
        env:
          KS_B64: ${{ secrets.PDFR2L_KEYSTORE_B64 }}
          PDFR2L_KEYSTORE_PASSWORD: ${{ secrets.PDFR2L_KEYSTORE_PASSWORD }}
          PDFR2L_KEY_ALIAS: pdfr2l
        run: |
          ANDROID_NDK_HOME=$(ls -d "$ANDROID_HOME"/ndk/* | sort -V | tail -1)
          export ANDROID_NDK_HOME
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export PDFR2L_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/pdf-r2l-rs.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/pdf-r2l-rs.apk
  release:
    needs: [windows, macos, linux, android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*/* --repo "${GITHUB_REPOSITORY}" --title "pdf-r2l-rs ${GITHUB_REF_NAME}" --notes "PDF R2L RS: Windows (installer) / macOS (dmg, unsigned) / Linux (.deb, .tar.gz) / Android (.apk). 英日併記のライセンス(LICENSES.txt) / Licenses in English and Japanese."
