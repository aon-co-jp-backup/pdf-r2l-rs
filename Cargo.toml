[workspace]
members = ["crates/pdf-r2l-core", "crates/pdf-r2l-desktop", "crates/pdf-r2l-cli", "crates/pdf-r2l-android"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/aon-co-jp/pdf-r2l-rs"
authors = ["石 塚 正 浩（MASAHIRO ISHIZUKA）"]

[workspace.dependencies]
# OCR・テキストフォント文字化・ページ描画の共有クレート(RPoem)。rev で固定する。
open-runo-pdf-ocr = { git = "https://github.com/aon-co-jp/RPoem", rev = "3b644db6299ded824ffc96153b3841216ae3f40e" }
lopdf = "0.42"
open-runo-sr = { git = "https://github.com/aon-co-jp/RPoem", rev = "3b644db6299ded824ffc96153b3841216ae3f40e" }

[profile.release]
opt-level = "s"
lto = true
strip = true

# 超解像の計算ループは速度優先(他はサイズ優先のまま)。
[profile.release.package.open-runo-sr]
opt-level = 3
